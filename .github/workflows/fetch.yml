name: Hae ottelutilastot
on:
  schedule:
    - cron: "10 22 * * *"   # pelipäivän jälkeen (klo 0.10 Suomen talviaikaa)
    - cron: "30 4 * * *"    # aamulla uusinta + päivän tuomarit (klo 6.30 talviaikaa)
  workflow_dispatch:
    inputs:
      date:
        description: "Päivä muodossa VVVV-KK-PP (tyhjä = viimeisin pelipäivä)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hae data
        run: python scripts/fetch_api_football.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATE: ${{ inputs.date }}
      - name: Tallenna
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Ottelutilastot"
          git push
